<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>multiplayer blockspace</title><style>body{margin:0;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;background:#111;color:#fff;font-family:sans-serif}.grid{display:grid;grid-template-columns:repeat(5,40px);gap:5px;margin-bottom:20px}.cell{width:40px;height:40px;background:#222;border:1px solid #444;cursor:pointer;display:flex;align-items:center;justify-content:center}.cell svg{width:20px;height:20px;fill:currentColor}button{padding:10px 20px;font-size:16px;cursor:pointer;margin:5px}</style></head><body><div id="size" style="margin-bottom:10px">screen: </div><div class="grid" id="g"></div><button id="fs">fullscreen</button><script>const ws=new WebSocket('wss://echo.websocket.events'),sz=document.getElementById('size'),g=document.getElementById('g'),btn=document.getElementById('fs');let gridState=Array(25).fill(0);const jumpSvg='<svg viewBox="0 0 24 24"><path d="M12 2a2 2 0 0 1 2 2 2 2 0 0 1-2 2 2 2 0 0 1-2-2 2 2 0 0 1 2-2m9 7h-6v13h-2v-6h-2v6H9V9H3V7h18v2Z"/></svg>';for(let i=0;i<25;i++){const c=document.createElement('div');c.className='cell';c.dataset.index=i;c.onclick=()=>{gridState[i]=gridState[i]===0?1:0;render();ws.send(JSON.stringify(gridState));};g.appendChild(c);}function render(){const w=window.innerWidth;sz.innerText=w<600?'mobile':w<1024?'tablet':'desktop';Array.from(g.children).forEach((c,i)=>{if(gridState[i]===1){c.style.background='#3498db';c.innerHTML=jumpSvg;}else{c.style.background='#222';c.innerHTML='';}});}window.addEventListener('resize',render);render();ws.onmessage=(e)=>{try{const d=JSON.parse(e.data);if(Array.isArray(d)&&d.length===25){gridState=d;render();}}catch(err){}};btn.addEventListener('click',()=>{if(!document.fullscreenElement){document.documentElement.requestFullscreen().catch(()=>{});}else{if(document.exitFullscreen){document.exitFullscreen();}}});</script></body></html>
