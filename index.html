
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Baseplate Hangout</title>
<style>
*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#87ceeb;font-family:Arial,sans-serif}canvas{display:block}#top{position:absolute;top:12px;left:12px;color:white;background:#222b;padding:12px;border-radius:7px;font-size:14px}#chat{position:absolute;bottom:15px;left:15px;width:270px;color:white;background:#111b;border-radius:7px;padding:10px}#messages{height:120px;overflow:auto;font-size:13px;overflow-wrap:anywhere}#chat input{width:100%;padding:9px;border:0;border-radius:4px;margin-top:7px;background:#333;color:white}#players{position:absolute;right:12px;top:12px;background:#111b;color:white;padding:12px;border-radius:7px;font-size:13px}#mobile{display:none;position:absolute;bottom:35px;right:25px;width:100px;height:100px;border-radius:50%;background:#ffffff55;border:2px solid white;touch-action:none}#stick{position:absolute;width:42px;height:42px;left:27px;top:27px;border-radius:50%;background:#fff9}#jump{display:none;position:absolute;bottom:65px;right:145px;border:0;border-radius:50%;width:65px;height:65px;background:#ffffff99;font-weight:bold;touch-action:none}@media(pointer:coarse){#mobile,#jump{display:block}#chat{width:190px}#messages{height:75px}}
</style>
</head>
<body>
<div id="top">BASEPLATE HANGOUT<br><span id="guest"></span></div>
<div id="players">PLAYERS<br>1</div>
<div id="chat"><div id="messages">Welcome to Baseplate Hangout!</div><input id="message" maxlength="100" placeholder="Type a message and press Enter"></div>
<div id="mobile"><div id="stick"></div></div>
<button id="jump">JUMP</button>
<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js";

const guestKey="baseplate_guest";
let guest=localStorage.getItem(guestKey);
if(!guest){guest="Guest #"+(10000+Math.floor(Math.random()*90000));localStorage.setItem(guestKey,guest)}
document.getElementById("guest").textContent=guest;

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x87ceeb);
scene.fog=new THREE.Fog(0x87ceeb,90,180);
const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,300);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x777777,2));
const sun=new THREE.DirectionalLight(0xffffff,2);
sun.position.set(-30,60,40);
sun.castShadow=true;
scene.add(sun);

const ground=new THREE.Mesh(new THREE.BoxGeometry(100,1,100),new THREE.MeshStandardMaterial({color:0x39a852}));
ground.position.y=-.5;
ground.receiveShadow=true;
scene.add(ground);

const studGeo=new THREE.CylinderGeometry(.22,.22,.12,12);
const studMat=new THREE.MeshStandardMaterial({color:0x269642});
for(let x=-49;x<=49;x+=2)for(let z=-49;z<=49;z+=2){
const stud=new THREE.Mesh(studGeo,studMat);
stud.position.set(x,.06,z);
stud.castShadow=true;
scene.add(stud);
}

function part(w,h,d,color,x,y,z){
const mesh=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial({color}));
mesh.position.set(x,y,z);
mesh.castShadow=true;
scene.add(mesh);
return mesh;
}

const avatar=new THREE.Group();
scene.add(avatar);
const torso=part(1.5,1.5,.7,0x1769aa,0,2,0);
const head=part(1,1,1,0xffcc80,0,3.25,0);
const leftArm=part(.5,1.5,.5,0xffcc80,-1,2,0);
const rightArm=part(.5,1.5,.5,0xffcc80,1,2,0);
const leftLeg=part(.6,1.2,.6,0x555555,-.4,.6,0);
const rightLeg=part(.6,1.2,.6,0x555555,.4,.6,0);
const face=new THREE.Mesh(new THREE.PlaneGeometry(.65,.3),new THREE.MeshBasicMaterial({color:0x222222}));
face.position.set(0,3.3,.506);
avatar.add(face);
const parts=[torso,head,leftArm,rightArm,leftLeg,rightLeg];
parts.forEach(p=>{scene.remove(p);avatar.add(p)});

const keys={};
addEventListener("keydown",e=>{keys[e.key.toLowerCase()]=true});
addEventListener("keyup",e=>{keys[e.key.toLowerCase()]=false});

let joyX=0,joyY=0,jumping=false,velocityY=0;
const mobile=document.getElementById("mobile"),stick=document.getElementById("stick");
mobile.addEventListener("pointerdown",e=>{mobile.setPointerCapture(e.pointerId);moveStick(e)});
mobile.addEventListener("pointermove",e=>{if(e.buttons)moveStick(e)});
mobile.addEventListener("pointerup",resetStick);
mobile.addEventListener("pointercancel",resetStick);
function moveStick(e){
const r=mobile.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),len=Math.min(35,Math.hypot(dx,dy)),a=Math.atan2(dy,dx);
joyX=Math.cos(a)*len/35;joyY=Math.sin(a)*len/35;
stick.style.left=27+joyX*30+"px";stick.style.top=27+joyY*30+"px";
}
function resetStick(){joyX=joyY=0;stick.style.left="27px";stick.style.top="27px"}
function jump(){if(avatar.position.y<=.01){velocityY=.22}}
document.getElementById("jump").addEventListener("pointerdown",jump);

document.getElementById("message").addEventListener("keydown",e=>{
if(e.key!=="Enter")return;
const input=e.target,text=input.value.trim();
if(!text)return;
const line=document.createElement("div");
line.textContent=guest+": "+text;
document.getElementById("messages").appendChild(line);
document.getElementById("messages").scrollTop=99999;
input.value="";
});

const clock=new THREE.Clock();
let walk=0;
function animate(){
requestAnimationFrame(animate);
const dt=Math.min(clock.getDelta(),.05);
let x=(keys.d?1:0)-(keys.a?1:0)+joyX;
let z=(keys.s?1:0)-(keys.w?1:0)+joyY;
const length=Math.hypot(x,z);
if(length>1){x/=length;z/=length}
if(length>.05){
avatar.position.x+=x*8*dt;
avatar.position.z+=z*8*dt;
avatar.rotation.y=Math.atan2(x,z);
walk+=dt*9;
}else walk=0;
leftArm.rotation.x=rightArm.rotation.x=length>.05?Math.sin(walk)*.6:0;
leftLeg.rotation.x=rightLeg.rotation.x=length>.05?Math.sin(walk)*.6:0;
velocityY-=.65*dt;
avatar.position.y=Math.max(0,avatar.position.y+velocityY);
if(avatar.position.y===0)velocityY=0;
const target=new THREE.Vector3(avatar.position.x,avatar.position.y+3,avatar.position.z);
const offset=new THREE.Vector3(0,5,10).applyAxisAngle(new THREE.Vector3(0,1,0),avatar.rotation.y);
camera.position.lerp(target.clone().add(offset),.12);
camera.lookAt(target);
renderer.render(scene,camera);
}
animate();
addEventListener("resize",()=>{
camera.aspect=innerWidth/innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
