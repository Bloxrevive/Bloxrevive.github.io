<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Bloxrevive</title><style>*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}body{background:#121212;color:#fff;display:flex;justify-content:center;align-items:center;min-height:100vh;overflow-x:hidden}.view{display:none;width:100%;height:100vh;justify-content:center;align-items:center;flex-direction:column;position:absolute;top:0;left:0}.active{display:flex}.container{background:rgba(18,18,18,.95);padding:36px 32px;border-radius:16px;box-shadow:0 12px 40px rgba(0,0,0,.8);width:100%;max-width:420px;display:flex;flex-direction:column;align-items:center;border:1px solid rgba(255,255,255,.08)}.logo{font-size:32px;font-weight:900;letter-spacing:2px;margin-bottom:20px;text-transform:uppercase;color:#fff}h2{font-size:15px;font-weight:700;margin-bottom:20px;text-align:center;color:#e0e0e0}.form-group{width:100%;margin-bottom:16px}label{display:block;font-size:12px;font-weight:600;margin-bottom:6px;color:#999}input[type="text"],input[type="password"]{width:100%;background:#242424;border:1px solid #333;color:#fff;padding:12px;border-radius:8px;font-size:14px;outline:none}.cookie-box{background:#1a1a1a;border:1px solid #333;padding:12px;border-radius:8px;margin-bottom:16px;font-size:12px;color:#bbb;text-align:center;width:100%}.error-msg{color:#ff4d4d;font-size:12px;margin-bottom:12px;text-align:center;display:none;width:100%}.btn{width:100%;background:#e0e0e0;color:#121212;border:none;padding:14px;border-radius:8px;font-size:15px;font-weight:700;cursor:pointer;margin-top:6px}.btn:hover{background:#fff}.nav-bar{position:absolute;top:0;width:100%;display:flex;justify-content:space-between;align-items:center;padding:20px 40px;background:#181818;border-bottom:1px solid #222}canvas{width:300px;height:300px;background:#181818;border-radius:12px}</style></head><body><div id="signup-view" class="view"><div class="container"><div class="logo">Bloxrevive</div><h2>SIGN UP AND START HAVING FUN!</h2><div class="form-group"><label>Username</label><input type="text" id="su-user" placeholder="Username"></div><div class="form-group"><label>Password</label><input type="password" id="su-pass" placeholder="Password"></div><div class="cookie-box"><label style="color:#bbb;cursor:pointer"><input type="checkbox" id="su-cookie-check" style="margin-right:6px"> Accept required security cookies to proceed</label></div><div id="su-error" class="error-msg"></div><button class="btn" onclick="handleSignup()">Sign Up</button></div></div><div id="home-view" class="view"><div class="nav-bar"><h3>Bloxrevive Home</h3><div><button class="btn" style="width:auto;padding:8px 16px;margin:0;display:inline-block" onclick="navTo('/my/avatar')">Avatar</button> <button class="btn" style="width:auto;padding:8px 16px;margin:0;display:inline-block" onclick="navTo('/settings')">Settings</button></div></div><h1>Welcome to Bloxrevive Home, Twin!</h1></div><div id="avatar-view" class="view"><div class="nav-bar"><h3>Avatar Editor</h3><button class="btn" style="width:auto;padding:8px 16px;margin:0" onclick="navTo('/home')">Home</button></div><canvas id="avatarCanvas"></canvas></div><div id="settings-view" class="view"><div class="nav-bar"><h3>Settings</h3><button class="btn" style="width:auto;padding:8px 16px;margin:0" onclick="navTo('/home')">Home</button></div><div class="container"><h2>Change Password</h2><div class="form-group"><label>New Password</label><input type="password" id="set-pass" placeholder="New Password"></div><button class="btn" onclick="updatePassword()">Update Password</button></div></div><script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script><script>function getCleanPath(){let p=window.location.pathname;if(p.endsWith('/index.html'))p=p.replace('/index.html','');return p||'/'}function router(){let p=getCleanPath();document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));if(p.includes('/CreateAccount')){document.getElementById('signup-view').classList.add('active')}else if(p.includes('/my/avatar')){document.getElementById('avatar-view').classList.add('active');init3D()}else if(p.includes('/settings')){document.getElementById('settings-view').classList.add('active')}else{document.getElementById('home-view').classList.add('active')}}function navTo(path){history.pushState({},'',path);router()}window.onpopstate=router;function genCookieString(){return'br_cookie_'+Math.random().toString(36).substring(2)+Date.now().toString(36)}function handleSignup(){let u=document.getElementById('su-user').value.trim();let p=document.getElementById('su-pass').value;let c=document.getElementById('su-cookie-check').checked;let e=document.getElementById('su-error');e.style.display='none';if(!c){e.style.display='block';e.innerText='Error: Cookies not accepted. Fix: You must check the cookie agreement box to let us store your local session string.';return}if(!u||!p){e.style.display='block';e.innerText='Error: Please fill out all required fields.';return}let userKey='user_cookies_'+u;let token=genCookieString();localStorage.setItem(userKey,token);localStorage.setItem('br_current_user',u);localStorage.setItem('br_pass',p);navTo('/home')}function updatePassword(){let np=document.getElementById('set-pass').value;let curUser=localStorage.getItem('br_current_user');if(!np){alert('Enter a valid password!');return}localStorage.setItem('br_pass',np);if(curUser){let newToken=genCookieString();localStorage.setItem('user_cookies_'+curUser,newToken);alert('Password updated! Your secure cookie string has been automatically updated and saved exclusively for your user profile.')}else{alert('Password updated!')}}let renderer,scene,camera,cube;function init3D(){if(renderer)return;let canvas=document.getElementById('avatarCanvas');scene=new THREE.Scene();camera=new THREE.PerspectiveCamera(75,1,.1,1000);renderer=new THREE.WebGLRenderer({canvas:canvas,alpha:true});renderer.setSize(300,300);let geom=new THREE.BoxGeometry(1.5,2,1);let mat=new THREE.MeshBasicMaterial({color:65404,wireframe:true});cube=new THREE.Mesh(geom,mat);scene.add(cube);camera.position.z=5;function animate(){requestAnimationFrame(animate);cube.rotation.x+=.01;cube.rotation.y+=.01;renderer.render(scene,camera)}animate()}let currentPath=getCleanPath();if(currentPath==='/'||currentPath===''){history.replaceState({},'','/CreateAccount')}router();</script></body></html>
