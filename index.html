<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloxrevive - Sign Up</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0d0d0d;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Background grid of game thumbnails */
        .bg-grid {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 12px;
            padding: 16px;
            opacity: 0.35;
            filter: blur(3px);
            z-index: 1;
            pointer-events: none;
        }

        .bg-tile {
            background: #1a1a1a;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Centralized Modal Container */
        .container {
            position: relative;
            z-index: 2;
            background: rgba(18, 18, 18, 0.95);
            padding: 36px 32px;
            border-radius: 16px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.8);
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .logo {
            font-size: 32px;
            font-weight: 900;
            letter-spacing: 2px;
            margin-bottom: 20px;
            text-transform: uppercase;
            color: #fff;
        }

        h2 {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 20px;
            text-align: center;
            letter-spacing: 0.5px;
            color: #e0e0e0;
        }

        .form-group {
            width: 100%;
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 6px;
            color: #999;
        }

        .date-row {
            display: flex;
            gap: 8px;
        }

        .date-row select {
            flex: 1;
            background: #242424;
            border: 1px solid #333;
            color: #fff;
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            outline: none;
        }

        input[type="text"], input[type="password"] {
            width: 100%;
            background: #242424;
            border: 1px solid #333;
            color: #fff;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }

        input::placeholder {
            color: #666;
        }

        .gender-row {
            display: flex;
            gap: 10px;
            margin-top: 6px;
        }

        .gender-btn {
            flex: 1;
            background: #242424;
            border: 1px solid #333;
            color: #fff;
            padding: 10px;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.2s;
        }

        .gender-btn:hover {
            background: #2e2e2e;
        }

        .terms {
            font-size: 11px;
            color: #777;
            line-height: 1.4;
            margin: 14px 0;
            text-align: center;
        }

        .terms a {
            color: #aaa;
            text-decoration: underline;
        }

        .signup-btn {
            width: 100%;
            background: #e0e0e0;
            color: #121212;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 6px;
            transition: background 0.2s;
        }

        .signup-btn:hover {
            background: #fff;
        }
    </style>
</head>
<body>

    <!-- Background Grid Effect -->
    <div class="bg-grid">
        <div class="bg-tile"></div>
        <div class="bg-tile"></div>
        <div class="bg-tile"></div>
        <div class="bg-tile"></div>
        <div class="bg-tile"></div>
        <div class="bg-tile"></div>
        <div class="bg-tile"></div>
        <div class="bg-tile"></div>
        <div class="bg-tile"></div>
        <div class="bg-tile"></div>
        <div class="bg-tile"></div>
        <div class="bg-tile"></div>
    </div>

    <!-- Centered Sign Up Box -->
    <div class="container">
        <div class="logo">Bloxrevive</div>
        <h2>SIGN UP AND START HAVING FUN!</h2>
        
        <div class="form-group">
            <label>Birthday</label>
            <div class="date-row">
                <select><option>Month</option></select>
                <select><option>Day</option></select>
                <select><option>Year</option></select>
            </div>
        </div>

        <div class="form-group">
            <label>Username</label>
            <input type="text" placeholder="Don't use your real name">
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" placeholder="At least 8 characters">
        </div>

        <div class="form-group">
            <label>Gender (optional)</label>
            <div class="gender-row">
                <div class="gender-btn">♂</div>
                <div class="gender-btn">♀</div>
            </div>
        </div>

        <div class="terms">
            By clicking Sign Up, you are agreeing to our <a href="#">Terms of Use</a> and acknowledge our <a href="#">Privacy Policy</a>.
        </div>

        <button class="signup-btn">Sign Up</button>
    </div>

</body>
  </html>
