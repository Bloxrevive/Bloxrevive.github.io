<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>bloxrevive</title><style>body{margin:0;overflow:hidden;background:#55b;font-family:sans-serif}#ui{position:absolute;top:10px;left:10px;color:#fff;background:rgba(0,0,0,0.6);padding:10px;border-radius:8px;z-index:10}#size{margin-bottom:5px}button{padding:8px 15px;background:#222;color:#fff;border:1px solid #555;cursor:pointer;border-radius:5px;margin-top:5px}#chat{position:absolute;bottom:20px;left:20px;width:250px;height:150px;background:rgba(0,0,0,0.6);border-radius:8px;display:flex;flex-direction:column;padding:8px;color:#fff;z-index:10}#chat-msgs{flex:1;overflow-y:auto;font-size:12px;margin-bottom:5px}#chat input{background:#222;border:1px solid #555;color:#fff;padding:5px;border-radius:4px}#lb-btn{position:absolute;top:10px;right:10px;z-index:10}#lb{position:absolute;top:50px;right:10px;width:150px;background:rgba(0,0,0,0.6);color:#fff;padding:10px;border-radius:8px;display:none;z-index:10}#controls{position:absolute;bottom:20px;right:20px;display:flex;gap:10px;z-index:10}.joy{width:60px;height:60px;background:rgba(255,255,255,0.2);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:bold;cursor:pointer}</style></head><body><div id="ui"><div id="size">screen: </div><button id="fs">fullscreen</button></div><button id="lb-btn">players</button><div id="lb"><b>online</b><ul id="lb-list" style="padding-left:15px;margin:5px 0"></ul></div><div id="chat"><div id="chat-msgs"></div><input id="chat-input" placeholder="chat here..."></div><div id="controls"><div class="joy" id="jump-btn">jump</div></div><script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script><script>const ws=new WebSocket('wss://echo.websocket.events'),sz=document.getElementById('size'),btn=document.getElementById('fs'),lbBtn=document.getElementById('lb-btn'),lb=document.getElementById('lb'),chatMsgs=document.getElementById('chat-msgs'),chatInput=document.getElementById('chat-input'),jumpBtn=document.getElementById('jump-btn');const scene=new THREE.Scene();scene.background=new THREE.Color(0x7ec0ee);const camera=new THREE.PerspectiveCamera(75,window.innerWidth/window.innerHeight,0.1,1000);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(window.innerWidth,window.innerHeight);document.body.appendChild(renderer.domElement);const light=new THREE.DirectionalLight(0xffffff,1);light.position.set(10,20,10);scene.add(light);scene.add(new THREE.AmbientLight(0xffffff,0.5));const floor=new THREE.Mesh(new THREE.PlaneGeometry(100,100),new THREE.MeshStandardMaterial({color:0x337733}));floor.rotation.x=-Math.PI/2;scene.add(floor);const myId='Guest #'+Math.floor(Math.random()*90000+10000);let players={};function createChar(){const g=new THREE.Group();const b=new THREE.Mesh(new THREE.BoxGeometry(0.8,1.2,0.4),new THREE.MeshStandardMaterial({color:0x1e90ff}));b.position.y=0.6;const h=new THREE.Mesh(new THREE.BoxGeometry(0.6,0.6,0.6),new THREE.MeshStandardMaterial({color:0xffdbac}));h.position.y=1.5;g.add(b,h);scene.add(g);return g;}const myAvatar=createChar();let pos={x:0,z:0,y:0},camAngle=0,isDragging=false,prevX=0;window.addEventListener('mousedown',(e)=>{isDragging=true;prevX=e.clientX;});window.addEventListener('mousemove',(e)=>{if(!isDragging)return;let dx=e.clientX-prevX;camAngle-=dx*0.005;prevX=e.clientX;});window.addEventListener('mouseup',()=>{isDragging=false;});window.addEventListener('touchstart',(e)=>{isDragging=true;prevX=e.touches[0].clientX;});window.addEventListener('touchmove',(e)=>{if(!isDragging)return;let dx=e.touches[0].clientX-prevX;camAngle-=dx*0.005;prevX=e.touches[0].clientX;});window.addEventListener('touchend',()=>{isDragging=false;});function updSize(){const w=window.innerWidth;sz.innerText=w<600?'mobile':w<1024?'tablet':'desktop';camera.aspect=w/window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(w,window.innerHeight);}window.addEventListener('resize',updSize);updSize();let moving=false;window.addEventListener('keydown',(e)=>{moving=true;if(e.key==='w')pos.z-=0.5;if(e.key==='s')pos.z+=0.5;if(e.key==='a')pos.x-=0.5;if(e.key==='d')pos.x+=0.5;myAvatar.position.set(pos.x,pos.y,pos.z);ws.send(JSON.stringify({id:myId,x:pos.x,y:pos.y,z:pos.z}));setTimeout(()=>{moving=false;},200);});jumpBtn.addEventListener('click',()=>{pos.y=1.5;setTimeout(()=>{pos.y=0;myAvatar.position.y=pos.y;ws.send(JSON.stringify({id:myId,x:pos.x,y:pos.y,z:pos.z}));},300);myAvatar.position.y=pos.y;ws.send(JSON.stringify({id:myId,x:pos.x,y:pos.y,z:pos.z}));});lbBtn.addEventListener('click',()=>{lb.style.display=lb.style.display==='block'?'none':'block';});chatInput.addEventListener('keypress',(e)=>{if(e.key==='Enter'&&chatInput.value.trim()){chatMsgs.innerHTML+=`<div>${myId}: ${chatInput.value}</div>`;chatInput.value='';chatMsgs.scrollTop=chatMsgs.scrollHeight;}});ws.onmessage=(e)=>{try{const d=JSON.parse(e.data);if(d.id&&d.id!==myId){if(!players[d.id])players[d.id]=createChar();players[d.id].position.set(d.x,d.y,d.z);}}catch(err){}};btn.addEventListener('click',()=>{if(!document.fullscreenElement){document.documentElement.requestFullscreen().catch(()=>{});}else{if(document.exitFullscreen){document.exitFullscreen();}}});function animate(){requestAnimationFrame(animate);if(!isDragging&&!moving){camAngle+=0.005;}camera.position.x=myAvatar.position.x+Math.sin(camAngle)*5;camera.position.z=myAvatar.position.z+Math.cos(camAngle)*5;camera.position.y=myAvatar.position.y+3;camera.lookAt(myAvatar.position.x,myAvatar.position.y+1,myAvatar.position.z);renderer.render(scene,camera);}animate();</script></body></html>
