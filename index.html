<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>app</title><style>body{margin:0;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;background:#111;color:#fff;font-family:sans-serif}#box{width:200px;height:200px;background:#3498db;display:flex;align-items:center;justify-content:center;transition:0.3s}button{margin-top:20px;padding:10px 20px;font-size:16px;cursor:pointer}</style></head><body><div id="box">screen: <span id="size"></span></div><button id="fs">fullscreen</button><script>const sz=document.getElementById('size'),bx=document.getElementById('box'),btn=document.getElementById('fs');function upd(){const w=window.innerWidth;sz.innerText=w<600?'mobile':w<1024?'tablet':'desktop';}window.addEventListener('resize',upd);upd();btn.addEventListener('click',()=>{if(!document.fullscreenElement){document.documentElement.requestFullscreen().catch(()=>{});}else{if(document.exitFullscreen){document.exitFullscreen();}}});</script></body></html>
