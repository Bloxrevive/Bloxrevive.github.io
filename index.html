<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>bloxrevive</title><style>body{margin:0;overflow:hidden;background:#55b;font-family:sans-serif}#ui{position:absolute;top:10px;left:10px;color:#fff;background:rgba(0,0,0,0.6);padding:10px;border-radius:8px}#size{margin-bottom:5px}button{padding:8px 15px;background:#222;color:#fff;border:1px solid #555;cursor:pointer;border-radius:5px}</style></head><body><div id="ui"><div id="size">screen: </div><button id="fs">fullscreen</button></div><script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script><script>const ws=new WebSocket('wss://echo.websocket.events'),sz=document.getElementById('size'),btn=document.getElementById('fs');const scene=new THREE.Scene();scene.background=new THREE.Color(0x7ec0ee);const camera=new THREE.PerspectiveCamera(75,window.innerWidth/window.innerHeight,0.1,1000);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(window.innerWidth,window.innerHeight);document.body.appendChild(renderer.domElement);const light=new THREE.DirectionalLight(0xffffff,1);light.position.set(10,20,10);scene.add(light);scene.add(new THREE.AmbientLight(0xffffff,0.5));const floor=new THREE.Mesh(new THREE.PlaneGeometry(100,100),new THREE.MeshStandardMaterial({color:0x337733}));floor.rotation.x=-Math.PI/2;scene.add(floor);const myId=Math.random().toString(36).substring(2,7);let players={};function createChar(){const group=new THREE.Group();const body=new THREE.Mesh(new THREE.BoxGeometry(0.8,1.2,0.4),new THREE.MeshStandardMaterial({color:0x1e90ff}));body.position.y=0.6;const head=new THREE.Mesh(new THREE.BoxGeometry(0.6,0.6,0.6),new THREE.MeshStandardMaterial({color:0xffdbac}));head.position.y=1.5;group.add(body,head);scene.add(group);return group;}const myAvatar=createChar();camera.position.set(0,3,5);camera.lookAt(0,1,0);function updSize(){const w=window.innerWidth;sz.innerText=w<600?'mobile':w<1024?'tablet':'desktop';camera.aspect=w/window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(w,window.innerHeight);}window.addEventListener('resize',updSize);updSize();let pos={x:0,z:0};window.addEventListener('keydown',(e)=>{if(e.key==='ArrowUp'||e.key==='w')pos.z-=0.5;if(e.key==='ArrowDown'||e.key==='s')pos.z+=0.5;if(e.key==='ArrowLeft'||e.key==='a')pos.x-=0.5;if(e.key==='ArrowRight'||e.key==='d')pos.x+=0.5;myAvatar.position.set(pos.x,0,pos.z);ws.send(JSON.stringify({id:myId,x:pos.x,z:pos.z}));});ws.onmessage=(e)=>{try{const d=JSON.parse(e.data);if(d.id&&d.id!==myId){if(!players[d.id])players[d.id]=createChar();players[d.id].position.set(d.x,0,d.z);}}catch(err){}};btn.addEventListener('click',()=>{if(!document.fullscreenElement){document.documentElement.requestFullscreen().catch(()=>{});}else{if(document.exitFullscreen){document.exitFullscreen();}}});function animate(){requestAnimationFrame(animate);renderer.render(scene,camera);}animate();</script></body></html>
